name: Update Thorium

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container: archlinux:latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm \
            base-devel \
            curl \
            git \
            jq \
            pacman-contrib

      - name: Clone repository
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

          cd repo

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE/repo"

      - name: Mark repository as safe
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/repo"

      - name: Update package
        run: |
          cd repo
          runuser -u builder -- ./update.sh

      - name: Commit and push
        run: |
          cd repo

          if git diff --quiet; then
            echo "No update available."
            exit 0
          fi

          git add PKGBUILD .SRCINFO

          git commit \
            -m "Update Thorium to $(sed -n 's/^pkgver=//p' PKGBUILD)"

          git push
